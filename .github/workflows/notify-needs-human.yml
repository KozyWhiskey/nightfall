# Notify a private Discord channel when a PR needs human approval.
# Setup: Discord channel → Edit channel → Integrations → Webhooks → New Webhook → copy URL
# then: gh secret set DISCORD_WEBHOOK_URL --repo KozyWhiskey/nightfall

name: notify-needs-human

on:
  pull_request:
    types: [labeled]

jobs:
  discord:
    if: github.event.label.name == 'needs-human'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post to Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_USER: ${{ github.event.pull_request.user.login }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL secret is not set; skipping notify."
            exit 0
          fi
          BODY=$(jq -n \
            --arg content "**Nightfall needs you** — new capability / design gate

PR #${PR_NUMBER}: ${PR_TITLE}
Opened by: ${PR_USER}
Label: \`needs-human\`
${PR_URL}

Review \`docs/specs/proposed/\`, then move to approved and add \`spec-approved\` when ready." \
            '{content: $content}')
          curl -fsS -H 'Content-Type: application/json' -d "$BODY" "$WEBHOOK_URL"
