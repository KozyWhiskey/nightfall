# Notify a private Discord channel when a PR needs human approval.
# Setup: Discord channel → Integrations → Webhooks → New Webhook → copy URL
# then: gh secret set DISCORD_WEBHOOK_URL --repo KozyWhiskey/nightfall

name: notify-needs-human

on:
  pull_request:
    types: [labeled]

jobs:
  discord:
    if: github.event.label.name == 'needs-human'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post to Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_USER: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK_URL}" ]; then
            echo "DISCORD_WEBHOOK_URL secret is not set; skipping notify."
            exit 0
          fi
          python3 <<'PY'
          import json, os, urllib.request

          content = (
              "**Nightfall needs you** — new capability / design gate\n\n"
              f"PR #{os.environ['PR_NUMBER']}: {os.environ['PR_TITLE']}\n"
              f"Opened by: {os.environ['PR_USER']}\n"
              "Label: `needs-human`\n"
              f"{os.environ['PR_URL']}\n\n"
              "Review `docs/specs/proposed/`, then move to approved and add "
              "`spec-approved` when ready."
          )
          req = urllib.request.Request(
              os.environ["WEBHOOK_URL"],
              data=json.dumps({"content": content}).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(req) as resp:
              print("discord status", resp.status)
          PY
